<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1B3139" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B3139"/>
    </marker>
    <marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2272B4"/>
    </marker>
    <style>
      .title{font:700 48px 'DM Sans',Arial,sans-serif;fill:#1B3139}
      .subtitle{font:400 25px 'DM Sans',Arial,sans-serif;fill:#5A6F77}
      .section{font:700 27px 'DM Sans',Arial,sans-serif;fill:#1B3139}
      .step{font:700 24px 'DM Sans',Arial,sans-serif;fill:#fff}
      .cardTitle{font:700 25px 'DM Sans',Arial,sans-serif;fill:#1B3139}
      .cardTitleWhite{font:700 25px 'DM Sans',Arial,sans-serif;fill:#fff}
      .body{font:400 19px 'DM Sans',Arial,sans-serif;fill:#5A6F77}
      .bodyWhite{font:400 19px 'DM Sans',Arial,sans-serif;fill:#fff}
      .label{font:700 16px 'DM Sans',Arial,sans-serif;fill:#FF3621;letter-spacing:1.4px}
      .small{font:400 17px 'DM Sans',Arial,sans-serif;fill:#5A6F77}
      .smallWhite{font:400 17px 'DM Sans',Arial,sans-serif;fill:#fff}
      .footer{font:400 18px 'DM Sans',Arial,sans-serif;fill:#5A6F77}
      .line{fill:none;stroke:#1B3139;stroke-width:4;marker-end:url(#arrow)}
      .blueLine{fill:none;stroke:#2272B4;stroke-width:4;marker-end:url(#blueArrow)}
      .dash{fill:none;stroke:#84969D;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#FFFFFF"/>
  <rect width="1920" height="12" fill="#FF3621"/>
  <text x="78" y="92" class="title">AI Functions cost toolkit</text>
  <text x="78" y="137" class="subtitle">Predict before scale. Run two paths on the same synthetic workload. Reconcile after billing lands.</text>

  <!-- Column backgrounds -->
  <rect x="58" y="185" width="485" height="785" rx="20" fill="#F8F7F5" stroke="#DDD9D2" stroke-width="2"/>
  <rect x="569" y="185" width="782" height="785" rx="20" fill="#FFF5F3" stroke="#F5C2BA" stroke-width="2"/>
  <rect x="1377" y="185" width="485" height="785" rx="20" fill="#EFF9F5" stroke="#A8DCC7" stroke-width="2"/>

  <!-- Section headers -->
  <circle cx="98" cy="231" r="25" fill="#1B3139"/><text x="98" y="239" text-anchor="middle" class="step">1</text>
  <text x="138" y="240" class="section">CONFIGURE AND GENERATE</text>
  <circle cx="609" cy="231" r="25" fill="#FF3621"/><text x="609" y="239" text-anchor="middle" class="step">2</text>
  <text x="649" y="240" class="section">RUN SIDE BY SIDE</text>
  <circle cx="1417" cy="231" r="25" fill="#00A972"/><text x="1417" y="239" text-anchor="middle" class="step">3</text>
  <text x="1457" y="240" class="section">RECONCILE AND DECIDE</text>

  <!-- Column 1 -->
  <rect x="90" y="285" width="421" height="145" rx="13" fill="#FFFFFF" stroke="#9AABB2" stroke-width="2" filter="url(#shadow)"/>
  <text x="301" y="328" text-anchor="middle" class="cardTitle">Bundle parameters</text>
  <text x="301" y="364" text-anchor="middle" class="body">catalog · schema · sample size</text>
  <text x="301" y="394" text-anchor="middle" class="body">model · team tag · owner</text>

  <path d="M301 430 L301 485" class="line"/>

  <rect x="90" y="488" width="421" height="171" rx="13" fill="#FFFFFF" stroke="#9AABB2" stroke-width="2" filter="url(#shadow)"/>
  <text x="301" y="532" text-anchor="middle" class="cardTitle">Synthetic transcripts</text>
  <text x="301" y="570" text-anchor="middle" class="body">Seeded fraud-style call records</text>
  <text x="301" y="600" text-anchor="middle" class="body">Same rows for both AI paths</text>
  <rect x="183" y="620" width="236" height="25" rx="12" fill="#EEEDE9"/>
  <text x="301" y="639" text-anchor="middle" class="small">Default: 100 rows</text>

  <path d="M301 659 L301 716" class="line"/>

  <rect x="90" y="720" width="421" height="154" rx="13" fill="#1B3139" filter="url(#shadow)"/>
  <text x="301" y="765" text-anchor="middle" class="cardTitleWhite">Unity Catalog tables</text>
  <text x="301" y="805" text-anchor="middle" class="bodyWhite">transcripts · extract_results</text>
  <text x="301" y="835" text-anchor="middle" class="bodyWhite">query_results · run_log</text>

  <text x="301" y="921" text-anchor="middle" class="small">Serverless notebook job · safe to rerun</text>

  <!-- Column 2 prediction box -->
  <rect x="612" y="286" width="696" height="103" rx="13" fill="#FFFFFF" stroke="#FF3621" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="320" text-anchor="middle" class="label">PREDICT BEFORE THE CALLS</text>
  <text x="960" y="354" text-anchor="middle" class="body">Published pricing formulas + input size  estimated cost in run_log</text>

  <path d="M960 389 L960 437" class="line"/>
  <path d="M960 437 C960 458 787 456 787 486" class="line"/>
  <path d="M960 437 C960 458 1133 456 1133 486" class="line"/>

  <!-- Path A -->
  <rect x="612" y="490" width="350" height="226" rx="15" fill="#2272B4" filter="url(#shadow)"/>
  <text x="641" y="528" class="smallWhite">PATH A</text>
  <text x="787" y="571" text-anchor="middle" class="cardTitleWhite">ai_extract</text>
  <text x="787" y="611" text-anchor="middle" class="bodyWhite">Structured fields per transcript</text>
  <text x="787" y="644" text-anchor="middle" class="bodyWhite">Per-input list-price estimate</text>
  <rect x="678" y="669" width="218" height="30" rx="15" fill="#FFFFFF" opacity="0.2"/>
  <text x="787" y="690" text-anchor="middle" class="smallWhite">managed extract endpoint</text>

  <!-- Path B -->
  <rect x="979" y="490" width="329" height="226" rx="15" fill="#FF3621" filter="url(#shadow)"/>
  <text x="1008" y="528" class="smallWhite">PATH B</text>
  <text x="1144" y="571" text-anchor="middle" class="cardTitleWhite">ai_query</text>
  <text x="1144" y="611" text-anchor="middle" class="bodyWhite">JSON from a Foundation Model</text>
  <text x="1144" y="644" text-anchor="middle" class="bodyWhite">Token-reference estimate</text>
  <rect x="1039" y="669" width="210" height="30" rx="15" fill="#FFFFFF" opacity="0.2"/>
  <text x="1144" y="690" text-anchor="middle" class="smallWhite">configured model endpoint</text>

  <path d="M787 716 C787 756 887 764 923 792" class="line"/>
  <path d="M1144 716 C1144 756 1044 764 1008 792" class="line"/>

  <rect x="705" y="795" width="510" height="114" rx="13" fill="#1B3139" filter="url(#shadow)"/>
  <text x="960" y="839" text-anchor="middle" class="cardTitleWhite">One comparable run log</text>
  <text x="960" y="876" text-anchor="middle" class="bodyWhite">rows · characters · run window · predicted cost</text>

  <!-- Cross-column table flow -->
  <path d="M511 797 C550 797 562 835 604 835" class="blueLine"/>

  <!-- Column 3 -->
  <rect x="1409" y="285" width="421" height="140" rx="13" fill="#FFFFFF" stroke="#9AABB2" stroke-width="2" filter="url(#shadow)"/>
  <text x="1620" y="328" text-anchor="middle" class="cardTitle">System billing tables</text>
  <text x="1620" y="365" text-anchor="middle" class="body">usage + list_prices</text>
  <text x="1620" y="397" text-anchor="middle" class="small">Typical lag: 1 to 4 hours</text>

  <path d="M1620 425 L1620 492" class="dash"/>

  <rect x="1409" y="495" width="421" height="178" rx="13" fill="#00A972" filter="url(#shadow)"/>
  <text x="1620" y="540" text-anchor="middle" class="cardTitleWhite">Reconcile</text>
  <text x="1620" y="579" text-anchor="middle" class="bodyWhite">Join by endpoint + run window</text>
  <text x="1620" y="610" text-anchor="middle" class="bodyWhite">Estimate vs actual + variance</text>
  <text x="1620" y="641" text-anchor="middle" class="smallWhite">Null actual means not billed yet</text>

  <path d="M1620 673 L1620 726" class="line"/>

  <rect x="1409" y="730" width="421" height="178" rx="13" fill="#1B3139" filter="url(#shadow)"/>
  <text x="1620" y="775" text-anchor="middle" class="cardTitleWhite">Decision output</text>
  <text x="1620" y="814" text-anchor="middle" class="bodyWhite">Measured cost per row</text>
  <text x="1620" y="845" text-anchor="middle" class="bodyWhite">Forecast at your workload volume</text>
  <text x="1620" y="876" text-anchor="middle" class="bodyWhite">Choose cost + quality fit</text>

  <!-- Flow from run log to reconcile -->
  <path d="M1215 852 C1320 852 1330 584 1400 584" class="blueLine"/>

  <text x="1620" y="943" text-anchor="middle" class="small">Optional hourly reconcile is paused by default</text>

  <!-- Footer -->
  <text x="78" y="1028" class="footer">
    <tspan fill="#FF3621" font-weight="700">Scope:</tspan>
    <tspan> synthetic data only. Predictions are estimates, not billed spend. Actual cost is shown only after billing data lands.</tspan>
  </text>
</svg>
